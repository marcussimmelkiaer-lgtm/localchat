name: Build installers

# Produces the downloadable installers — ONE file per OS, no models inside
# (the app downloads its default model on first launch):
#   - macOS (Apple Silicon): dist/LocalChat-arm64.dmg
#   - Windows (x64):         dist/installer/LocalChat-Setup-x64.exe
#
# No GPU is needed to FREEZE (only to run inference), so these jobs work on
# stock runners. Each installer is ~100 MB — small enough for a GitHub release
# asset. They ship UNSIGNED for now (see packaging/README.md); signing/
# notarization hooks are stubbed in the build scripts. Manual trigger or a
# version tag only.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  PYTHON_VERSION: "3.12"

jobs:
  macos:
    name: macOS .dmg (Apple Silicon)
    runs-on: macos-14 # arm64 — the only arch nobodywho ships a wheel for
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Nicer DMG layout (optional)
        run: brew install create-dmg || true

      - name: Build .app + .dmg
        run: |
          chmod +x packaging/macos/build_mac.sh
          ./packaging/macos/build_mac.sh

      # Run the app FROM THE BUILT .dmg on this clean runner: first-run model
      # download (a tiny model, not the 2.5 GB default) + load + one chat reply.
      # CPU only — runners have no usable GPU. See packaging/smoke_test.py.
      - name: Smoke-test the .dmg (first-run download + chat)
        env:
          LOCALCHAT_DEFAULT_MODEL: huggingface:unsloth/gemma-3-270m-it-GGUF/gemma-3-270m-it-Q3_K_M.gguf
          LOCALCHAT_USE_GPU: "0"
        run: |
          hdiutil attach dist/LocalChat-arm64.dmg -nobrowse -mountpoint /Volumes/LocalChatSmoke
          python packaging/smoke_test.py /Volumes/LocalChatSmoke/LocalChat.app/Contents/MacOS/LocalChat
          hdiutil detach /Volumes/LocalChatSmoke

      - uses: actions/upload-artifact@v4 # Node 20; fine for artifact upload
        with:
          name: LocalChat-macos-arm64
          path: dist/LocalChat-arm64.dmg
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows installer (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./packaging/build_win.ps1 -SkipFrontend

      # Silent-install the built Setup.exe on this clean runner, then run the
      # INSTALLED app: first-run model download (tiny model) + load + one chat
      # reply. CPU only. See packaging/smoke_test.py.
      - name: Smoke-test the installer (first-run download + chat)
        shell: pwsh
        env:
          LOCALCHAT_DEFAULT_MODEL: huggingface:unsloth/gemma-3-270m-it-GGUF/gemma-3-270m-it-Q3_K_M.gguf
          LOCALCHAT_USE_GPU: "0"
        run: |
          $p = Start-Process dist/installer/LocalChat-Setup-x64.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          python packaging/smoke_test.py "$env:LOCALAPPDATA\Programs\LocalChat\LocalChat.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: LocalChat-windows-x64
          path: dist/installer/LocalChat-Setup-x64.exe
          retention-days: 7
          if-no-files-found: error
