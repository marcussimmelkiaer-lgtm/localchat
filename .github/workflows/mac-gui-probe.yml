name: macOS window probe

# Opens the real LocalChat window on macOS runners and checks the app exits
# cleanly when closed / quit in different states (packaging/mac_gui_probe.py).
# Runners have no usable GPU (Metal is unavailable in their VMs), so the model
# runs on CPU; screenshots and crash reports are uploaded as an artifact.

on:
  workflow_dispatch:
  push:
    branches: [workshop-launchers]
    paths:
      - backend/main.py
      - packaging/mac_gui_probe.py
      - .github/workflows/mac-gui-probe.yml

jobs:
  probe:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    env:
      LOCALCHAT_USE_GPU: "0"
      RUNNER_LABEL: ${{ matrix.os }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -q -r backend/requirements.txt
          cp backend/config.example.toml config.toml
          python -m backend.fetch_model
      - name: Probe the window
        run: python packaging/mac_gui_probe.py
      - name: Upload screenshots and crash reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: probe-${{ matrix.os }}
          path: probe-out/
