name: macOS first-run smoke

# Exercises the real first-run path on an Apple Silicon (arm64) runner:
# the run.sh guards, `pip install -r requirements.txt` (the arm64 nobodywho
# wheel must resolve — there is no x86_64 wheel and no sdist), the stdlib
# `tomllib` import (needs Python 3.11+), and a headless server boot.
#
# GitHub's macos-14 / macos-15 runners are Apple Silicon. They have NO GPU,
# so Metal won't engage — `use_gpu` falls back to CPU. That's fine here: this
# validates the dependency-install + boot path, not generation speed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  first-run:
    name: Install + boot on Apple Silicon
    runs-on: macos-14 # Apple Silicon (arm64)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Confirm the runner is arm64
        run: |
          arch="$(uname -m)"
          echo "runner arch: $arch"
          test "$arch" = "arm64"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Seed a dummy model so fetch_model is a no-op (skip the 2.5 GB download)
        run: |
          python3 - <<'PY'
          import pathlib, re
          dummy = pathlib.Path("ci-dummy.gguf").resolve()
          dummy.write_bytes(b"")  # not a real GGUF; never loaded (warmup is never triggered)
          cfg = pathlib.Path("config.toml")
          cfg.write_text(pathlib.Path("config.example.toml").read_text(encoding="utf-8"), encoding="utf-8")
          t = cfg.read_text(encoding="utf-8")
          t = re.sub(r'^\s*model_path\s*=.*$', f'model_path = "{dummy.as_posix()}"', t, count=1, flags=re.M)
          cfg.write_text(t, encoding="utf-8")
          print("seeded config.toml ->", dummy)
          PY

      - name: Run run.sh headless (first-run install + boot)
        env:
          LOCALCHAT_NO_WINDOW: "1"
        run: |
          chmod +x run.sh
          ./run.sh > run.log 2>&1 &
          echo "RUN_PID=$!" >> "$GITHUB_ENV"
          echo "started run.sh (pid $!)"

      - name: Wait for /healthz (covers venv + pip install + boot)
        run: |
          ok=""
          for i in $(seq 1 600); do
            if ! kill -0 "$RUN_PID" 2>/dev/null; then
              echo "::error::run.sh exited before the server came up"
              cat run.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8765/healthz >/dev/null 2>&1; then
              ok="yes"; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::/healthz never returned 200"
            cat run.log
            exit 1
          fi
          echo "healthz says:"
          curl -fsS http://127.0.0.1:8765/healthz

      - name: Assert arm64 wheel + tomllib imports inside the venv
        run: |
          venv/bin/python - <<'PY'
          import platform, nobodywho
          import backend.config  # top-level `import tomllib` runs here (needs 3.11+)
          assert platform.machine() == "arm64", platform.machine()
          print("OK: nobodywho imported on arm64; backend.config (tomllib) imported")
          PY

      - name: Stop the server
        if: always()
        run: |
          if [ -n "${RUN_PID:-}" ]; then kill "$RUN_PID" 2>/dev/null || true; fi

      - name: Dump run log on failure
        if: failure()
        run: cat run.log || true

  python-version-guard:
    name: run.sh rejects Python < 3.11
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: run.sh must fail fast with a clear message on 3.10
        run: |
          chmod +x run.sh
          if ./run.sh > guard.log 2>&1; then
            echo "::error::run.sh should have refused Python 3.10 but exited 0"
            cat guard.log
            exit 1
          fi
          echo "--- run.sh output ---"
          cat guard.log
          grep -q "needs Python 3.11+" guard.log
          echo "OK: 3.11+ guard fired as expected"
