name: Workshop first run

# Runs the real first-run path a workshop participant hits, on a clean machine
# per OS: build the desktop app (desktop-app.yml), export the slim single-OS repo
# with it (packaging/export_workshop.py), run its launcher (uv -> Python 3.12 ->
# packages -> default model download -> unpack + start the app, which starts the
# backend), check the model loads and answers a chat message, then quit the app
# like a user and check the app and backend exit cleanly.
#
# This downloads the REAL default model
# (Qwen3-0.6B, ~640 MB). Runners have no usable GPU, so it runs on CPU.

on:
  push:
    branches: [main, workshop-launchers]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    uses: ./.github/workflows/desktop-app.yml

  first-run:
    name: ${{ matrix.os }}
    needs: app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon (arm64)
            target: mac
            app: macos
          - os: windows-latest
            target: windows
            app: windows
    env:
      LOCALCHAT_USE_GPU: "0"
      LOCALCHAT_PORT: "8765"
      PYTHONUNBUFFERED: "1" # live smoke-test output in the log
    steps:
      - uses: actions/checkout@v5

      # This Python only runs the export + check scripts. The launcher ignores
      # it (UV_PYTHON_PREFERENCE=only-managed) and brings its own via uv.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v5
        with:
          name: LocalChat-${{ matrix.app }}
          path: ${{ runner.temp }}/app

      - name: Export the slim ${{ matrix.target }} repo
        shell: bash
        run: |
          echo "SLIM=$RUNNER_TEMP/LocalChat" >> "$GITHUB_ENV"
          python packaging/export_workshop.py ${{ matrix.target }} "$RUNNER_TEMP/LocalChat" --repo-url https://example.invalid/localchat.git --app-dir "$RUNNER_TEMP/app"

      - name: Run the macOS launcher
        if: matrix.target == 'mac'
        shell: bash
        working-directory: ${{ runner.temp }}/LocalChat
        run: |
          chmod +x "Start LocalChat.command"
          "./Start LocalChat.command"

      - name: Screenshot the app window
        if: matrix.target == 'mac'
        shell: bash
        run: |
          sleep 20
          mkdir -p "$RUNNER_TEMP/shots"
          screencapture -x "$RUNNER_TEMP/shots/macos-app.png"

      - uses: actions/upload-artifact@v5
        if: matrix.target == 'mac'
        with:
          name: screenshot-macos
          path: ${{ runner.temp }}/shots/

      - name: App loads the model, chats, and quits cleanly
        if: matrix.target == 'mac'
        shell: bash
        run: python packaging/smoke_test.py --quit

      # One step on Windows: the runner kills processes a step leaves behind
      # when it ends, which would take the detached app down before the check.
      # Launcher output goes to a file so the app doesn't hold the step's pipes.
      - name: Run the Windows launcher, then the app loads the model, chats, and quits cleanly
        if: matrix.target == 'windows'
        shell: cmd
        working-directory: ${{ runner.temp }}/LocalChat
        run: |
          call "Start LocalChat.bat" > launcher.log 2>&1
          set rc=%errorlevel%
          type launcher.log
          if not "%rc%"=="0" exit /b %rc%
          python "%GITHUB_WORKSPACE%\packaging\smoke_test.py" --quit

      - name: Dump logs on failure
        if: failure()
        shell: bash
        run: |
          cat "$SLIM/launcher.log" 2>/dev/null || true
          cat "$SLIM/LocalChat data/LocalChat.log" 2>/dev/null || true
