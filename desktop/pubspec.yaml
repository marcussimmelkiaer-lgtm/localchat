name: localchat
description: "LocalChat desktop app"
publish_to: 'none'

# Not the release version: workshop builds are tracked by app/version.txt.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  file_selector: ^1.1.0
  url_launcher: ^6.3.3
  gpt_markdown: ^1.3.4
